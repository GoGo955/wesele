<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porównanie ofert weselnych — Boho vs Kleser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // ustaw motyw przed renderem (bez mignięcia)
  (function(){
    var t=localStorage.getItem('motyw');
    if(!t) t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
    document.documentElement.setAttribute('data-theme',t);
  })();
</script>
<style>
:root{
  --bg:#f6f3ee; --card:#fffdfb; --ink:#23201c; --muted:#857c70;
  --line:#e9e3d9; --accent:#a9764f; --accent2:#6f8576;
  --win:#e9f2ea; --winline:#6f8576; --radius:16px;
  --shadow:0 1px 2px rgba(60,45,30,.05),0 10px 30px -8px rgba(60,45,30,.10);
  --boho:#a9764f; --kleser:#6f8576;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:16px/1.55 var(--sans);color:var(--ink);padding:0 0 64px;
  background:
    radial-gradient(60% 50% at 12% -5%, rgba(169,118,79,.10), transparent 70%),
    radial-gradient(55% 45% at 92% 0%, rgba(111,133,118,.12), transparent 70%),
    var(--bg);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
h1{font-family:var(--serif);font-size:38px;font-weight:560;letter-spacing:-.01em;line-height:1.05}
.sub{color:var(--muted);margin-top:6px}
.panel{background:rgba(255,253,251,.78);backdrop-filter:blur(12px) saturate(1.4);-webkit-backdrop-filter:blur(12px) saturate(1.4);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:8px 0 22px;position:sticky;top:0;z-index:5}
.panel .row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.fld input,.fld select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);min-width:120px}
.fld input[type=number]{width:96px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.cols{grid-template-columns:1fr}.panel{position:static}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;gap:14px;transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(60,45,30,.05),0 22px 48px -14px rgba(60,45,30,.18)}
.card.win{border-color:var(--winline);box-shadow:0 0 0 2px var(--win),var(--shadow);background:linear-gradient(180deg,rgba(111,133,118,.06),transparent 120px),var(--card)}
.card.win::before{content:"✓ taniej";align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--winline);padding:3px 10px;border-radius:999px}
.card h2{font-family:var(--serif);font-size:21px;font-weight:540;letter-spacing:-.01em}
.card .total{font-family:var(--serif);font-size:42px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.card .per{color:var(--muted);font-size:14px}
.opts{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.opts .grp{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.chk select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.chk input[type=number]{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
.brk{list-style:none;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:12px}
.brk li{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.brk li span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
.badge{display:inline-block;font-size:12px;padding:4px 11px;border-radius:999px;background:rgba(133,124,112,.10);color:var(--muted);font-weight:600;align-self:flex-start}
.alert{font-size:13px;background:#fbf3e3;border:1px solid #ecd9ad;color:#8a5a00;padding:9px 12px;border-radius:10px}
.diff{text-align:center;margin:10px 0 26px;font-size:15px;color:var(--muted)}
.diff b{font-family:var(--serif);font-weight:560;color:var(--ink);font-variant-numeric:tabular-nums}
table.cechy{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table.cechy th,table.cechy td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
table.cechy th{background:#f0ebe2;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
table.cechy tbody tr:hover td{background:rgba(169,118,79,.04)}
table.cechy td:first-child{font-weight:600;width:180px}
h3.sek{margin:10px 0 12px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.btn-szcz{display:block;margin:0 auto 18px;font:inherit;font-weight:600;cursor:pointer;padding:11px 22px;border:1px solid var(--line);border-radius:999px;background:var(--card);box-shadow:var(--shadow);color:var(--ink);transition:border-color .2s,transform .2s,box-shadow .2s}
.btn-szcz:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.szcz{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 0 26px}
@media(max-width:760px){.szcz{grid-template-columns:1fr}}
.szcz .col{display:flex;flex-direction:column;gap:12px}
.szcz .col>h3{font-size:15px;padding-bottom:8px;border-bottom:2px solid var(--line)}
.op-pkg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.op-pkg .op-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.op-pkg .op-head b{font-size:15px}
.op-pkg .op-head .op-cena{font-size:13px;color:var(--muted);white-space:nowrap}
.op-course{font-size:13.5px;line-height:1.45;margin:4px 0}
.op-course .lab{color:var(--accent);font-weight:600}
.op-pkg.kl .op-course .lab{color:var(--accent2)}
.op-empty{color:var(--muted);font-size:13px;font-style:italic}
.op-pkg{transition:transform .2s,box-shadow .2s}
.op-pkg:hover{transform:translateY(-2px);box-shadow:0 12px 28px -10px rgba(60,45,30,.18)}
.chk{transition:color .15s}
.chk:hover{color:var(--ink)}
/* focus states */
input:focus-visible,select:focus-visible,button:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.fld:focus-within label{color:var(--accent)}
/* header + theme toggle */
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.theme-btn{flex:none;width:42px;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center;transition:transform .25s,border-color .2s,background .2s}
.theme-btn:hover{transform:rotate(-12deg) scale(1.06);border-color:var(--accent)}
.mini-btn{font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:5px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);transition:border-color .2s,color .2s,transform .15s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:no-preference){
  header.wrap{animation:rise .5s both}
  #panel{animation:rise .5s .06s both}
  #cols{animation:rise .5s .12s both}
}
::selection{background:color-mix(in srgb,var(--accent) 24%,transparent)}
html{color-scheme:light}
*{transition-property:background-color,border-color}
body{transition:background-color .3s}
/* dark theme */
html[data-theme="dark"]{color-scheme:dark}
[data-theme="dark"]{
  --bg:#1a1714; --card:#252019; --ink:#f0e9df; --muted:#a99e8d;
  --line:#3a332a; --win:#22302a; --winline:#86a08e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -10px rgba(0,0,0,.55);
  --boho:#cf9a6c; --kleser:#8aa593; --accent:#cf9a6c; --accent2:#8aa593;
}
[data-theme="dark"] body{
  background:
    radial-gradient(60% 50% at 12% -5%, rgba(207,154,108,.10), transparent 70%),
    radial-gradient(55% 45% at 92% 0%, rgba(138,165,147,.12), transparent 70%),
    var(--bg);
}
[data-theme="dark"] .panel{background:rgba(37,32,25,.78)}
[data-theme="dark"] table.cechy th{background:#2d271f}
[data-theme="dark"] table.cechy tbody tr:hover td{background:rgba(207,154,108,.06)}
[data-theme="dark"] .alert{background:#332a18;border-color:#5a4a22;color:#e6c98a}
[data-theme="dark"] .badge{background:rgba(169,158,141,.16)}
[data-theme="dark"] .card.win{background:linear-gradient(180deg,rgba(138,165,147,.10),transparent 120px),var(--card)}
[data-theme="dark"] .op-course .lab,[data-theme="dark"] .fld:focus-within label{filter:brightness(1.1)}
</style>
</head>
<body>
<header class="wrap" style="padding-top:32px;padding-bottom:16px">

      <h1>Porównanie ofert weselnych</h1>

<section id="panel" class="wrap"></section>
<section id="cols" class="wrap"></section>

const aktualnyTier = () => (document.querySelector('input[name=resztaTier]:checked')||{}).value==="premium" ? "p" : "b";
function liczReszta(){
  const t=aktualnyTier(); let min=0,max=0;
  RESZTA.forEach(c=>{
    const el=document.getElementById('rk_'+c.k);
    const inc = el ? el.checked : !c.opt;
    if(inc){ min+=c[t][0]; max+=c[t][1]; }
  });

}

// Buduje kartę opisu pakietu: tytuł + cena + zawartość (obiekt danie:opis lub string)
function blokOpis(tytul, cena, dane, kl){
  let body;
  if(dane && typeof dane==='object'){
    body = Object.entries(dane).map(([lab,txt])=>`<div class="op-course"><span class="lab">${lab}:</span> ${txt}</div>`).join("");
  } else {
    body = `<div class="op-course">${dane}</div>`;
  }
  return `<div class="op-pkg${kl?' kl':''}">
    <div class="op-head"><b>${tytul}</b>${cena?`<span class="op-cena">${cena}</span>`:""}</div>
    ${body}
  </div>`;
}
function szczegolyBoho(ob){
  const O=OPISY.boho, P=OFERTY.boho;
  let h = blokOpis("Menu "+ob.menu, P.menu[ob.menu]+" zł/os", O.menu[ob.menu], false);
  h += blokOpis("Napoje — wersja "+ob.napoje, P.napoje[ob.napoje]+" zł/os", O.napoje[ob.napoje], false);
  const nazwyB={srodziemnomorski:"Bufet śródziemnomorski",street:"Bufet street food",swojski:"Bufet swojski"};
  if(ob.opcje && ob.opcje.bufet) h += blokOpis(nazwyB[ob.opcje.bufet], P.bufet[ob.opcje.bufet]+" zł/os", O.bufet[ob.opcje.bufet], false);
  return h;
}
function szczegolyKleser(ok){
  const O=OPISY.kleser, P=OFERTY.kleser, D=O.dodatki, yr=ok.rok;
  const zrCena = (ok.styl==="patera" ? P.obiadPatera[ok.pakiet] : P.obiadTalerz[ok.pakiet])[yr];
  const zrOpis = ok.styl==="patera" ? O.obiadPatera[ok.pakiet] : O.obiadTalerz[ok.pakiet];
  let h = blokOpis("Obiad ("+(ok.styl==="patera"?"patera":"talerz")+") — Pakiet "+ok.pakiet, zrCena+" zł/os", zrOpis, true);
  if(ok.korkowe){
    h += blokOpis("Napoje — Pakiet I (bezalkoholowe)", P.napoje.I[yr]+" zł/os", O.napoje.I, true);
    h += blokOpis("Korkowe — serwis alkoholu własnego", P.korkowe[yr]+" zł/os", O.korkowe, true);
  } else h += blokOpis("Napoje — Pakiet "+ok.napoje, P.napoje[ok.napoje][yr]+" zł/os", O.napoje[ok.napoje], true);
  const d=ok.dodatki||{};
  const flat={bufetZimno:["Bufet na zimno",P.dodatki.bufetZimno],meksyk:["Ciepła kolacja Meksyk",P.dodatki.meksyk],liveCooking:["Live cooking",P.dodatki.liveCooking],pizza:["Pizza w ogrodzie",P.dodatki.pizza],burgery:["Burgery w ogrodzie",P.dodatki.burgery],bliskiWschod:["Bliski Wschód",P.dodatki.bliskiWschod]};
  Object.keys(flat).forEach(k=>{ if(d[k]) h += blokOpis(flat[k][0], flat[k][1][yr]+" zł/os", D[k], true); });
  if(d.kolacjaSerw) h += blokOpis("Kolacja serwowana — Opcja "+d.kolacjaSerw, P.dodatki.kolacjaSerw[d.kolacjaSerw][yr]+" zł/os", D.kolacjaSerw[d.kolacjaSerw], true);
  if(d.cieplaMiska) h += blokOpis("Ciepła miska — Opcja "+d.cieplaMiska, P.dodatki.cieplaMiska[d.cieplaMiska][yr]+" zł/os", D.cieplaMiska[d.cieplaMiska], true);
  if(d.slodkiStol)  h += blokOpis("Słodki stół ("+(d.slodkiStol==="szt5"?"5 szt":"3 szt")+")", P.dodatki.slodkiStol[d.slodkiStol][yr]+" zł/os", D.slodkiStol, true);
  if(d.serwisCiast) h += blokOpis("Serwis ciast z zewnątrz ("+(d.serwisCiast==="tortStol"?"tort + słodki stół":"tort")+")", P.dodatki.serwisCiast[d.serwisCiast][yr]+" zł/os", D.serwisCiast, true);
  if(ok.laflor && ok.laflor!=='brak') h += blokOpis("Dekoracje La Flor — "+ok.laflor, "poza progiem min.", O.laFlor[ok.laflor], true);
  return h;
}

function liczBoho(w){
  const O=OFERTY.boho;
  const billable = w.dorosli + O.dzieci.znizka * (w.dzieci50||0);
  const r=[]; // rozbicie {k, v}
  const menuC = billable * O.menu[w.menu];
  const napC  = billable * O.napoje[w.napoje];
  r.push({k:"Menu "+w.menu+" ("+O.menu[w.menu]+" zł/os)", v:menuC});
  r.push({k:"Napoje wersja "+w.napoje+" ("+O.napoje[w.napoje]+" zł/os)", v:napC});

  const min = O.minDnia[w.dzien];
  const brak = Math.max(0, min - w.dorosli);
  const doplata = brak * O.doplataBrakujacy;
  if(doplata>0) r.push({k:"Dopłata za brakujących ("+brak+" × 250 zł)", v:doplata});

  const op=w.opcje||{}, no=w.nocleg||{};
  if(op.ceremonia) r.push({k:"Ceremonia w plenerze", v:O.ceremonia});
  if(op.godziny)   r.push({k:"Dodatkowe godziny ("+op.godziny+"× 1500 zł)", v:op.godziny*O.dodatkowaGodzina});
  if(op.bufet)     r.push({k:"Bufet: "+op.bufet+" ("+O.bufet[op.bufet]+" zł/os)", v:billable*O.bufet[op.bufet]});
  if(no.apartamenty) r.push({k:"Apartamenty 2-os ("+no.apartamenty+"× 600 zł)", v:no.apartamenty*O.nocleg.apartament});
  if(no.domki)       r.push({k:"Domki 6-os ("+no.domki+"× 1200 zł)", v:no.domki*O.nocleg.domek});
  if(no.sniadania)   r.push({k:"Śniadania ("+no.sniadania+"× 80 zł)", v:no.sniadania*O.nocleg.sniadanie});
  if(op.lodzSesja)        r.push({k:"Sesja na łodzi", v:O.lodz.sesja});
  if(op.lodzPrzyplyniecie) r.push({k:"Przypłynięcie do ślubu", v:O.lodz.przyplyniecie});

  const suma = r.reduce((s,x)=>s+x.v,0);
  const alerty=[];
  if(doplata>0) alerty.push("Poniżej minimum dnia ("+min+" os) — dopłata "+fmtPLN(doplata)+".");
  return {rozbicie:r, suma, alerty, czas:12, info:"Czas: 12 h w cenie. Rezerwacja 8000 zł wliczana w cenę."};
}

function liczLaFlor(pkg, stoliki){
  const p=OFERTY.kleser.laFlor[pkg]; if(!p) return 0;
  return stoliki*p.stolik + p.pm + OFERTY.kleser.laFlorDojazd;
}

  Object.keys(flat).forEach(key=>{ if(d[key]){ const c=D[key][yr]; r.push({k:flat[key]+" ("+c+" zł/os)", v:billable*c}); } });
  if(d.kolacjaSerw){ const c=D.kolacjaSerw[d.kolacjaSerw][yr]; r.push({k:"Kolacja serwowana Opcja "+d.kolacjaSerw+" ("+c+" zł/os)", v:billable*c}); }
  if(d.cieplaMiska){ const c=D.cieplaMiska[d.cieplaMiska][yr]; r.push({k:"Ciepła miska Opcja "+d.cieplaMiska+" ("+c+" zł/os)", v:billable*c}); }
  if(d.slodkiStol){ const c=D.slodkiStol[d.slodkiStol][yr]; r.push({k:"Słodki stół "+(d.slodkiStol==="szt5"?"5 szt":"3 szt")+" ("+c+" zł/os)", v:billable*c}); }
  if(d.serwisCiast){ const c=D.serwisCiast[d.serwisCiast][yr]; r.push({k:"Serwis ciast z zewnątrz "+(d.serwisCiast==="tortStol"?"(tort + słodki stół)":"(tort)")+" ("+c+" zł/os)", v:billable*c}); }

  const computed = r.reduce((s,x)=>s+x.v,0);
  const mb=O.minBudget[w.sezon][w.dzien][yr];
  let suma=computed; const alerty=[];
  if(computed < mb){ suma=mb; r.push({k:"Próg min. budżetu ("+LATA[yr]+", "+(w.sezon==="hi"?"VI–IX":"X–V")+", "+w.dzien+")", v:mb-computed}); alerty.push("Catering poniżej progu — naliczono minimalny budżet "+fmtPLN(mb)+"."); }
  const mos=O.minOs[w.dzien];
  if(w.dorosli < mos) alerty.push("Goście poniżej minimum ("+mos+" os) dla tego dnia.");

  // La Flor — dekoracje doliczane poza progiem minimalnym
  if(w.laflor && w.laflor!=='brak'){
    const ciala=(w.dorosli||0)+(w.dzieci50||0)+(w.dzieciGratis||0);
    const stoliki=Math.max(1, Math.ceil(ciala/(w.osStolik||10)));
    const dekor=liczLaFlor(w.laflor, stoliki);
    r.push({k:"Dekoracje La Flor "+w.laflor+" ("+stoliki+" stolików + stół PM + dojazd)", v:dekor});
    suma+=dekor;
  }

  // czas trwania z liczby ciepłych kolacji
  let ck=0;
  ["meksyk","liveCooking","pizza","burgery","bliskiWschod"].forEach(k=>{ if(d[k]) ck++; });
  if(d.kolacjaSerw) ck++; if(d.cieplaMiska) ck++;
  ck=Math.min(ck,3);
  const czas = {0:5,1:6,2:9,3:12}[ck];
  return {rozbicie:r, suma, alerty, czas, info:"Rok "+LATA[yr]+". Czas zależny od ciepłych kolacji: "+ck+" → "+czas+" h."};
}

  eq("Boho A suma", liczBoho({dorosli:100,dzieci50:0,dzieciGratis:0,dzien:"sob",menu:"I",napoje:"I",opcje:{},nocleg:{}}).suma, 54500);
  // B: Boho sob, 70 dorosłych, Menu I, Napoje I -> 31500+6650+5000(20*250)=43150
  eq("Boho B dopłata", liczBoho({dorosli:70,dzieci50:0,dzieciGratis:0,dzien:"sob",menu:"I",napoje:"I",opcje:{},nocleg:{}}).suma, 43150);
  // C: Kleser 2028 hi sob, 100, talerz I(240), napoje I(90), bufetZimno(90) -> 100*420=42000 < próg 75000 -> 75000
  eq("Kleser C próg", liczKleser({dorosli:100,dzieci50:0,dzieciGratis:0,dzien:"sob",rok:2,sezon:"hi",styl:"talerz",pakiet:"I",napoje:"I",korkowe:false,dodatki:{bufetZimno:true}}).suma, 75000);
  // D: Kleser 2028 hi sob, 120, talerz III(330), napoje III(180), bufetZimno(90), meksyk(80), kolacjaSerw I(55) = 120*735=88200 > próg
  eq("Kleser D suma", liczKleser({dorosli:120,dzieci50:0,dzieciGratis:0,dzien:"sob",rok:2,sezon:"hi",styl:"talerz",pakiet:"III",napoje:"III",korkowe:false,dodatki:{bufetZimno:true,meksyk:true,kolacjaSerw:"I"}}).suma, 88200);
  // D2: czas = 2 ciepłe kolacje (meksyk + kolacjaSerw) -> 9h
  eq("Kleser D czas", liczKleser({dorosli:120,dzieci50:0,dzieciGratis:0,dzien:"sob",rok:2,sezon:"hi",styl:"talerz",pakiet:"III",napoje:"III",korkowe:false,dodatki:{bufetZimno:true,meksyk:true,kolacjaSerw:"I"}}).czas, 9);

  // F: ceny per rok i patera
  eq("PP talerz III 2026", OFERTY.kleser.obiadTalerz.III[0], 250);
  eq("PP patera I 2028", OFERTY.kleser.obiadPatera.I[2], 330);
  // G: 2026 hi sob, 100, talerz I(180), napoje I(70), bufetZimno(70)=32000 < próg 45000 -> 45000
  eq("Kleser 2026 próg", liczKleser({dorosli:100,dzieci50:0,dzieciGratis:0,dzien:"sob",rok:0,sezon:"hi",styl:"talerz",pakiet:"I",napoje:"I",korkowe:false,dodatki:{bufetZimno:true}}).suma, 45000);
  // H: La Flor BASIC, 10 stolików = 10*150+1500+150 = 3150
  eq("La Flor BASIC×10", liczLaFlor("BASIC",10), 3150);
  // I: D + La Flor BASIC (120 ciał /10 = 12 stolików -> 12*150+1500+150=3450) -> 88200+3450=91650
  eq("Kleser D + La Flor", liczKleser({dorosli:120,dzieci50:0,dzieciGratis:0,dzien:"sob",rok:2,sezon:"hi",styl:"talerz",pakiet:"III",napoje:"III",korkowe:false,laflor:"BASIC",osStolik:10,dodatki:{bufetZimno:true,meksyk:true,kolacjaSerw:"I"}}).suma, 91650);

  // J: Korkowe = Pakiet I bezalk. + korkowe (NIE zamiast napojów). 2028 hi sob, 120, talerz III(330)+P1(90)+korkowe(40)+bufetZimno(90)+meksyk(80)+kolacjaSerw I(55)=685 ×120=82200 > próg 75000
  eq("Kleser korkowe + P1", liczKleser({dorosli:120,dzieci50:0,dzieciGratis:0,dzien:"sob",rok:2,sezon:"hi",styl:"talerz",pakiet:"III",napoje:"I",korkowe:true,dodatki:{bufetZimno:true,meksyk:true,kolacjaSerw:"I"}}).suma, 82200);
  // K: Serwis ciast z zewnątrz (tort+słodki stół 15 zł/os) doliczany. D(735) + 15 = 750 ×120 = 90000
  eq("Kleser serwis ciast", liczKleser({dorosli:120,dzieci50:0,dzieciGratis:0,dzien:"sob",rok:2,sezon:"hi",styl:"talerz",pakiet:"III",napoje:"III",korkowe:false,dodatki:{bufetZimno:true,meksyk:true,kolacjaSerw:"I",serwisCiast:"tortStol"}}).suma, 90000);

  // E: Reszta wesela, wariant budżetowy domyślny (bez plannera i poprawin)
  eq("Reszta budżet min", liczReszta().min, 32700);
  eq("Reszta budżet max", liczReszta().max, 53050);

  // Pokrycie opisów: każdy wybieralny klucz musi mieć wpis w OPISY
  const has=(o,k)=>o&&o[k]!=null&&(typeof o[k]!=='object'||Object.keys(o[k]).length>0);
  const cov=(name,bool)=>T.push({name,ok:!!bool,got:!!bool,exp:true});
  ["I","II","III","IV"].forEach(k=>cov("opis boho.menu."+k, has(OPISY.boho.menu,k)));
  ["I","II"].forEach(k=>cov("opis boho.napoje."+k, has(OPISY.boho.napoje,k)));
  ["srodziemnomorski","street","swojski"].forEach(k=>cov("opis boho.bufet."+k, has(OPISY.boho.bufet,k)));
  ["I","II","III"].forEach(k=>cov("opis kleser.talerz."+k, has(OPISY.kleser.obiadTalerz,k)));
  cov("opis kleser.patera.I", has(OPISY.kleser.obiadPatera,"I"));
  ["I","II","III"].forEach(k=>cov("opis kleser.napoje."+k, has(OPISY.kleser.napoje,k)));
  cov("opis kleser.korkowe", has(OPISY.kleser,"korkowe"));
  ["bufetZimno","meksyk","liveCooking","pizza","burgery","bliskiWschod","kolacjaSerw","cieplaMiska","slodkiStol","serwisCiast"].forEach(k=>cov("opis kleser.dodatki."+k, has(OPISY.kleser.dodatki,k)));
  ["I","II","III"].forEach(k=>{ cov("opis kolacjaSerw."+k, has(OPISY.kleser.dodatki.kolacjaSerw,k)); cov("opis cieplaMiska."+k, has(OPISY.kleser.dodatki.cieplaMiska,k)); });

  const fail=T.filter(t=>!t.ok);
  console.log("%cSELF-TEST: "+(fail.length?fail.length+" FAIL":"WSZYSTKIE OK"), "font-weight:bold;color:"+(fail.length?"#c0392b":"#27ae60"));
  T.forEach(t=>console.log((t.ok?"✓":"✗")+" "+t.name+" got="+t.got+" exp="+t.exp));
  return fail.length===0;
}
if(location.hash==="#test"){ window.addEventListener('DOMContentLoaded',runSelfTests); }
</script>
